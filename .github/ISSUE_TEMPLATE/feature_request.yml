name: Feature request
description: Suggest a new entity, option, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This integration is a read-only mirror of the Unique Smart API, so what
        it can expose is bounded by what that API returns. If you are asking for
        a new sensor, the fastest way to get it added is to show that the data
        is already in the API response — see the last field below.

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched the existing issues and this has not been requested yet
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - A new entity for data the API already returns
        - A configuration option
        - A change to an existing entity
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: |
        Describe what you are trying to do and where the integration gets in the
        way. Concrete use cases ("I want to be notified when …") are much easier
        to act on than abstract requests.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: |
        For example a template sensor or an automation that already works around
        this. Knowing what you tried helps judge whether this belongs in the
        integration itself.

  - type: textarea
    id: api_data
    attributes:
      label: Relevant API data
      description: |
        Only for a new entity. Download diagnostics (Settings → Devices &
        services → Unique Waterontharder → ⋮ → Download diagnostics) and paste
        the field you want exposed. The API key is redacted automatically.

        If the field is not in there, the integration cannot read it either and
        the request has to go to Unique instead.
      render: json
