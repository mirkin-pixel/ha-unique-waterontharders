name: Bug report
description: Report a problem with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A debug log and the diagnostics file let me trace
        almost any problem directly — without them it is mostly guesswork.
        See [Troubleshooting](../../#troubleshooting) in the README for how to
        collect both.

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched the existing issues and this has not been reported yet
          required: true
        - label: I am running the latest version of the integration
          required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Shown in HACS, or found in `manifest.json`.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About
      placeholder: "2026.3.1"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is going wrong?
      description: Describe what happens and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …

  - type: textarea
    id: affected_entities
    attributes:
      label: Affected entities
      description: For example `sensor.unique_smart_duo_salt_level`, or "all of them".

  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Enable debug logging, reproduce the problem, then disable it again —
        Home Assistant downloads the log automatically.

        The API key is never logged. Your serial number is, so feel free to
        remove it before pasting.
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → Devices & services → Unique Waterontharder → ⋮ → Download
        diagnostics, then drag the file into this field. The API key is
        redacted automatically.
