name: Something is not working
description: An entity that is missing or wrong, a setup that fails, a value that makes no sense.
title: "<what goes wrong, in a few words>"
labels: ["bug"]
assignees: ["mirkin-pixel"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. A debug log and the diagnostics file let me trace almost any problem directly; without them it is mostly guesswork. The [troubleshooting section](https://github.com/mirkin-pixel/ha-unique-waterontharders#troubleshooting) of the README explains how to collect both. Not sure it is a bug? [Ask in Q&A](https://github.com/mirkin-pixel/ha-unique-waterontharders/discussions/new?category=q-a) first.

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched the existing issues and this has not been reported yet
          required: true
        - label: I am running the latest version of the integration
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected instead
      description: An entity name, a value you see and the value you think it should be, an error from the setup. A screenshot is welcome.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version of Unique Waterontharder
      description: Shown in the Marketplace (HACS before Home Assistant 2026.11), or under Settings → Devices & services → Unique Waterontharder.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: homeassistant
    attributes:
      label: Version of Home Assistant
      description: Settings → About.
      placeholder: "2026.11.2"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - Marketplace (HACS before Home Assistant 2026.11)
        - Manual
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …

  - type: textarea
    id: affected_entities
    attributes:
      label: Affected entities
      description: For example `sensor.unique_smart_duo_salt_level`, or "all of them".

  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Enable debug logging, reproduce the problem, then disable it again; Home Assistant downloads the log automatically. The API key is never logged. Your serial number is, so feel free to remove it before pasting.
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Unique Waterontharder, the three dots, **Download diagnostics**, and drag the file in here. The API key and the serial numbers are already left out of it.
      placeholder: Drag the downloaded .json file here.
